# .github/workflows/swift.yml
name: NeedleTailIRC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SWIFT_VERSION: 6.4.x-snapshot

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libcurl4-openssl-dev

      - name: Install Swift 6.4 with Swiftly
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --skip-install --assume-yes --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          swiftly install --assume-yes --use --post-install-file=swiftly-post-install.sh "$SWIFT_VERSION"
          if [ -f swiftly-post-install.sh ]; then
            sudo bash swiftly-post-install.sh
          fi
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Verify toolchain
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build

      - name: Test (debug)
        run: swift test

      - name: Build (release)
        run: swift build --configuration release

      - name: Test (release)
        run: swift test --configuration release

      - name: Check complete concurrency
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift 6.4 with Swiftly
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --skip-install --assume-yes --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

          TOOLCHAIN=""
          for candidate in "$HOME/Library/Developer/Toolchains/"*.xctoolchain; do
            if [ -f "$candidate/usr/lib/swift/macosx/libswift_Concurrency.dylib" ]; then
              TOOLCHAIN="$candidate"
              break
            fi
          done
          if [ -z "$TOOLCHAIN" ]; then
            echo "Swiftly toolchain runtime not found"
            exit 1
          fi
          echo "DYLD_LIBRARY_PATH=${TOOLCHAIN}/usr/lib/swift/macosx" >> "$GITHUB_ENV"
          if [ -f "$TOOLCHAIN/Info.plist" ]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$TOOLCHAIN/Info.plist" 2>/dev/null || true)
            if [ -n "$BUNDLE_ID" ]; then
              echo "TOOLCHAINS=$BUNDLE_ID" >> "$GITHUB_ENV"
            fi
          fi

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Verify toolchain
        run: swiftly run swift --version +"$SWIFT_VERSION"

      - name: Build and test (debug)
        run: swiftly run swift test +"$SWIFT_VERSION"

      - name: Build and test (release)
        run: swiftly run swift test --configuration release +"$SWIFT_VERSION"

      - name: Check complete concurrency
        run: >
          swiftly run swift build
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          +"$SWIFT_VERSION"

      - name: Build documentation
        run: >
          swiftly run swift package
          --allow-writing-to-directory .build/documentation
          generate-documentation
          --target NeedleTailIRC
          --output-path .build/documentation
          --warnings-as-errors
          +"$SWIFT_VERSION"
